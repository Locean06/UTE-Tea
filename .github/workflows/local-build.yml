name: Build and local demo smoke test
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Package Spring Boot
        run: |
          chmod +x mvnw
          ./mvnw -B -ntp -DskipTests package
      - name: Validate cart JavaScript and template structure
        run: |
          node --check src/main/resources/static/js/customer/customer.js
          node --check src/main/resources/static/js/customer/delivery-checkout.js
          node src/test/js/cart-address-save.cjs
          node --check src/main/resources/static/js/customer/order-success.js
          node src/test/js/order-success-dialog.cjs
          python3 - <<'PY'
          from pathlib import Path
          page = Path('src/main/resources/templates/customer/cart.html').read_text(encoding='utf-8')
          markup = page.split('<th:block th:fragment="scripts">', 1)[0]
          assert markup.count('<div') == markup.count('</div>'), 'Cart HTML div tags are unbalanced'
          for element in ('cartContainer', 'cartEmpty', 'cartLoadError', 'retryCartLoad', 'branchCheckout'):
              source = page if element != 'branchCheckout' else Path('src/main/resources/templates/fragments/delivery-checkout.html').read_text(encoding='utf-8')
              assert f'id="{element}"' in source, f'Missing cart UI element: {element}'
          print('Cart template structural checks passed')
          PY
      - name: Smoke test H2 demo profile (no external credentials)
        shell: bash
        run: |
          java -jar target/milktea-0.0.1-SNAPSHOT.jar --spring.profiles.active=demo --server.port=18080 > /tmp/ute-tea-demo.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          for i in {1..60}; do
            if curl -f -s http://localhost:18080/actuator/health | grep -q '"status":"UP"'; then
              echo "UTE Tea demo health UP"
              curl -fsS http://localhost:18080/cart > /tmp/ute-tea-cart.html
              grep -q 'id="cartContainer"' /tmp/ute-tea-cart.html
              grep -q 'id="branchCheckout"' /tmp/ute-tea-cart.html
              grep -q 'id="uteOrderPlacedDialog"' /tmp/ute-tea-cart.html
              grep -q 'id="uteOrderPlacedClose"' /tmp/ute-tea-cart.html
              echo "Cart page rendered successfully"
              exit 0
            fi
            if ! kill -0 "$app_pid" 2>/dev/null; then
              echo "Application exited early"
              cat /tmp/ute-tea-demo.log
              exit 1
            fi
            sleep 3
          done
          echo "Timed out waiting for demo startup"
          tail -n 160 /tmp/ute-tea-demo.log
          exit 1
