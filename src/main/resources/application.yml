spring:
  application:
    name: ute-tea
  # Read local .env without requiring exported PowerShell environment variables.
  config:
    import: "optional:file:./.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=UTE_Tea;encrypt=true;trustServerCertificate=true}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:12345}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
    properties:
      hibernate:
        format_sql: true
        show_sql: false
        type:
          preferred_instant_jdbc_type: TIMESTAMP
        jdbc:
          time_zone: UTC
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  thymeleaf:
    cache: false
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: ${SERVER_FORWARD_HEADERS_STRATEGY:framework}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true

app:
  payment:
    vietqr-bank-bin: ${VIETQR_BANK_BIN:}
  pos:
    shop-id: ${POS_SHOP_ID:0}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:}
    hash-secret: ${VNPAY_HASH_SECRET:}
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/marketplace}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  jwt:
    issuer: milktea
    audience: milktea-web
    secret-base64: ${JWT_SECRET_BASE64:dGhpc0lzQVZlcnlTZWN1cmVCYXNlNjRTZWNyZXRLZXlGb3JNaWxrVGVhQXBwMjAyNg==}
    ttl-minutes: 60
    cookie-secure: ${JWT_COOKIE_SECURE:false}
  websocket:
    allowed-origin: ${WS_ALLOWED_ORIGIN:http://localhost:8080}
  admin:
    default-password: ${ADMIN_PASSWORD:123456}
  cloudinary:
    cloud-name: ${CLOUDINARY_CLOUD_NAME:}
    api-key: ${CLOUDINARY_API_KEY:}
    api-secret: ${CLOUDINARY_API_SECRET:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
    sender-name: ${MAIL_SENDER_NAME:UTE TEA}
  otp:
    secret: ${OTP_SECRET:}
    expiry-minutes: 10
    cooldown-seconds: 60
    max-attempts: 5
