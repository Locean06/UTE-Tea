<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><body>
<section th:fragment="panel" id="branchCheckout" class="card border-0 shadow-sm rounded-4 p-3 p-sm-4 my-4">
 <style>
  #checkoutPaymentDialog { width: min(440px, calc(100% - 32px)); border: 0; border-radius: 20px; padding: 24px; color: var(--text-color, #303a2d); box-shadow: 0 16px 60px #263a2933; }
  #checkoutPaymentDialog::backdrop { background: #263a2966; }
  #checkoutPaymentDialog .payment-option { display: flex; align-items: center; gap: 12px; padding: 16px; border: 1px solid #dce4d8; border-radius: 12px; margin-bottom: 12px; cursor: pointer; }
  #checkoutPaymentDialog .payment-option:has(input:checked) { border-color: var(--primary-color, #565c45); background: #f3f5ed; }
  #checkoutPaymentDialog input { accent-color: var(--primary-color, #565c45); }
 </style>
 <h2 class="h5">Thông tin đơn hàng</h2>
 <div id="checkoutMessage" role="status" class="alert d-none text-break"></div>
 <form id="branchOrderForm">
  <p id="checkoutTable" class="small fw-semibold d-none"></p>
  <div id="checkoutProducts" class="border-top pt-3 mb-3"></div>
  <div id="branchQuote" class="border-top pt-3 mb-3" aria-live="polite">Thêm món để xem tổng tiền.</div>
  <button id="checkoutRetry" type="button" class="btn btn-outline-secondary mb-3 d-none">Thử tính tiền lại</button>
  <button id="checkoutBtn" type="submit" class="btn btn-primary-custom w-100 py-3" disabled>Gửi đơn hàng</button>
 </form>
 <dialog id="checkoutPaymentDialog" aria-labelledby="checkoutPaymentTitle" aria-describedby="checkoutPaymentHelp">
  <form id="checkoutPaymentForm">
   <h3 id="checkoutPaymentTitle" class="h5 mb-2">Chọn phương thức thanh toán</h3>
   <p id="checkoutPaymentHelp" class="text-muted small">Chọn cách thanh toán để xác nhận gửi đơn.</p>
   <p class="d-flex justify-content-between gap-2 mb-4"><span>Tổng thanh toán</span><strong id="checkoutPaymentTotal"></strong></p>
   <div id="checkoutPaymentError" class="alert alert-danger small d-none" role="alert"></div>
   <label class="payment-option"><input type="radio" name="paymentMethod" value="CASH" required><span>Tiền mặt <small class="d-block text-muted">Thanh toán tại quầy</small></span></label>
   <label class="payment-option"><input type="radio" name="paymentMethod" value="BANK_TRANSFER" required><span>Chuyển khoản ngân hàng <small class="d-block text-muted">Thông tin chuyển khoản hiện sau khi tạo đơn</small></span></label>
   <div class="d-flex flex-wrap gap-2 mt-4">
    <button id="checkoutPaymentBack" type="button" class="btn btn-outline-secondary">Quay lại</button>
    <button id="checkoutPaymentConfirm" type="submit" class="btn btn-primary-custom flex-grow-1">Xác nhận và gửi đơn</button>
   </div>
  </form>
 </dialog>
</section>
</body></html>
