<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<section th:fragment="panel" id="branchCheckout" class="card border-0 shadow-sm rounded-4 p-3 p-sm-4 my-4">
 <div class="d-flex align-items-center justify-content-between gap-2 mb-3">
   <h2 class="h5 mb-0">Thông tin nhận hàng</h2>
   <a sec:authorize="hasRole('CUSTOMER')" href="/my-orders" class="btn btn-sm btn-outline-secondary">Đơn đã đặt</a>
 </div>
 <label class="form-label fw-semibold" for="fulfillmentMode">Hình thức nhận món</label>
 <select id="fulfillmentMode" class="form-select mb-3"><option value="DELIVERY">Giao tận nơi</option><option value="COUNTER">Nhận tại quầy / mang về</option></select>
 <div id="checkoutMessage" role="alert" class="alert d-none text-break"></div>
 <div id="counterCheckout" class="d-none"><button id="checkoutBtn" type="button" class="btn btn-primary-custom w-100 py-3" onclick="CustomerApp.submitOrder()">Đặt nhận tại quầy</button></div>
 <div id="deliveryFields">
   <div id="deliveryLogin" class="alert alert-warning d-none">Vui lòng <a href="/login?redirect=/cart">đăng nhập</a> để đặt giao hàng.</div>
   <div class="ute-delivery-form-section mb-3">
     <div class="d-flex justify-content-between align-items-center gap-2 mb-2">
       <label for="checkoutAddress" class="form-label fw-semibold mb-0">Địa chỉ giao hàng</label>
       <details id="newAddressDetails" class="ute-new-address"><summary>+ Thêm địa chỉ</summary>
         <form id="checkoutAddressForm" class="row g-2 mt-2">
           <div class="col-12 col-sm-6"><label for="checkoutRecipient" class="form-label">Người nhận *</label><input id="checkoutRecipient" name="recipient" class="form-control" autocomplete="name" maxlength="120" required></div>
           <div class="col-12 col-sm-6"><label for="checkoutPhone" class="form-label">Số điện thoại *</label><input id="checkoutPhone" name="phone" type="tel" class="form-control" autocomplete="tel" pattern="[+0-9 .()\-]{8,20}" maxlength="20" required></div>
           <div class="col-12"><label for="checkoutAddressLine" class="form-label">Địa chỉ nhận hàng *</label><textarea id="checkoutAddressLine" name="addressLine" class="form-control" rows="2" autocomplete="street-address" maxlength="500" placeholder="Số nhà, đường, phường/xã, tỉnh/thành" required></textarea></div>
           <div class="col-12"><label for="checkoutArea" class="form-label">Quận / khu vực (không bắt buộc)</label><input id="checkoutArea" name="area" class="form-control" maxlength="120" placeholder="VD: Thủ Đức"></div>
           <input id="checkoutLatitude" name="latitude" type="hidden" value=""><input id="checkoutLongitude" name="longitude" type="hidden" value="">
           <div class="col-12 d-flex justify-content-between align-items-center flex-wrap gap-2"><label class="small"><input name="defaultAddress" type="checkbox" checked> Đặt làm mặc định</label><button class="btn btn-primary-custom" type="submit">Lưu địa chỉ</button></div>
         </form>
       </details>
     </div>
     <select id="checkoutAddress" class="form-select" required><option value="">Chọn địa chỉ giao hàng</option></select>
     <p id="selectedAddressPreview" class="visually-hidden" aria-live="polite"></p>
   </div>
   <form id="deliveryCheckout">
     <div class="ute-delivery-form-section mb-3">
       <label for="checkoutShop" class="form-label fw-semibold">Cơ sở phục vụ</label>
       <select id="checkoutShop" class="form-select" required disabled><option value="">Chọn địa chỉ trước</option></select>
       <p id="branchRankingHelp" class="visually-hidden"></p>
       <div id="branchAvailability" role="status" class="small text-muted text-break mt-1"></div>
       <div id="checkoutDeliveryInfo" class="ute-delivery-courier small text-muted" aria-live="polite"></div>
     </div>
     <div class="ute-delivery-form-section mb-3">
       <label for="checkoutVoucher" class="form-label fw-semibold">Mã giảm giá <span class="text-muted fw-normal">(nếu có)</span></label>
       <div class="input-group">
         <input id="checkoutVoucher" class="form-control" maxlength="32" placeholder="VD: GIAMGIA10" autocomplete="off" pattern="[A-Za-z0-9_-]{3,32}">
         <button id="applyCheckoutVoucher" class="btn btn-outline-success" type="button">Áp dụng</button>
       </div>
       <p id="checkoutVoucherNotice" class="small text-muted mt-1 mb-0" aria-live="polite"></p>
     </div>
     <div id="branchQuote" class="ute-delivery-quote" aria-live="polite">Chọn địa chỉ để xem tổng tiền.</div>
     <button id="deliverySubmit" class="btn btn-primary-custom w-100 py-3 fw-semibold mt-3" type="submit" disabled>Tiếp tục thanh toán</button>
   </form>
 </div>
 <!-- Chỉ tạo đơn sau khi người dùng xác nhận ở bước 2. Giữ nguyên COD/VNPAY backend cũ. -->
 <dialog id="deliveryPaymentDialog" class="ute-checkout-dialog" aria-labelledby="deliveryPaymentHeading">
   <form id="deliveryPaymentForm">
     <div class="ute-checkout-dialog-header">
       <h3 id="deliveryPaymentHeading" class="h5 mb-1">Xác nhận đặt giao hàng</h3>
       <p class="small text-muted mb-0">Kiểm tra số tiền và chọn phương thức thanh toán.</p>
     </div>
     <div class="ute-checkout-dialog-body">
       <p id="deliveryPaymentBranch" class="small text-muted mb-2"></p>
       <div class="d-flex justify-content-between align-items-center small mb-2"><span>Mã giảm giá</span><strong id="deliveryPaymentVoucher">Không áp dụng</strong></div>
       <div class="d-flex justify-content-between align-items-center small mb-2"><span>Đã trừ</span><strong id="deliveryPaymentDiscount">0 ₫</strong></div>
       <div class="d-flex justify-content-between align-items-center fw-semibold mb-3"><span>Tổng thanh toán sau ưu đãi</span><strong id="deliveryPaymentTotal" class="text-success fs-5"></strong></div>
       <fieldset class="border-0 p-0">
         <legend class="form-label fw-semibold fs-6">Phương thức thanh toán</legend>
         <label class="d-block border rounded-3 p-3 mb-2"><input type="radio" name="paymentMethod" value="COD" required> <strong>COD</strong> · Thanh toán khi nhận hàng</label>
         <label class="d-block border rounded-3 p-3 mb-2"><input type="radio" name="paymentMethod" value="VNPAY" required> <strong>VNPAY</strong> · Chuyển tới cổng thanh toán sandbox</label>
       </fieldset>
       <div id="deliveryPaymentError" role="alert" class="alert alert-danger d-none small mt-2"></div>
     </div>
     <div class="ute-checkout-dialog-actions">
       <button type="button" id="deliveryPaymentBack" class="btn btn-outline-secondary">Quay lại</button>
       <button type="submit" id="deliveryPaymentConfirm" class="btn btn-primary-custom">Xác nhận và đặt đơn</button>
     </div>
   </form>
 </dialog>
 <style>
  .ute-checkout-dialog { border: 1px solid #dbe2d3; border-radius: 20px; width: min(96vw, 480px); padding:0; color:#344530; box-shadow:0 20px 70px rgba(24,44,30,.25); max-height: min(90dvh,820px); }
  .ute-checkout-dialog::backdrop { background:rgba(22,34,27,.58); }
  .ute-checkout-dialog-header, .ute-checkout-dialog-body { padding:18px 22px; }
  .ute-checkout-dialog-header { background:#f5f7f0; border-bottom:1px solid #e1e7da; }
  .ute-checkout-dialog-actions { display:flex; justify-content:flex-end; gap:10px; padding:15px 22px 20px; }
  .ute-checkout-dialog input[type="radio"] { accent-color:#44684f; }
 </style>
 <style>
  #branchCheckout {border:1px solid #e0e8db!important;background:#fff;max-width:900px;margin-inline:auto}
  #branchCheckout .ute-delivery-form-section {margin-bottom:16px}
  #branchCheckout .ute-new-address {position:relative;font-size:13px}
  #branchCheckout .ute-new-address > summary {font-weight:600;color:#416c4a;cursor:pointer;list-style:none}
  #branchCheckout .ute-new-address > summary::-webkit-details-marker {display:none}
  #branchCheckout .ute-new-address[open] {position:static}
  #branchCheckout .ute-new-address[open] > form {padding:14px;border:1px solid #dce7da;border-radius:12px;background:#f8fbf7;margin-top:10px!important}
  #branchCheckout #checkoutDeliveryInfo {margin-top:4px}
  #branchCheckout .ute-delivery-quote {border-top:1px solid #e6ece3;padding-top:14px;font-size:14px}
  #branchCheckout .ute-delivery-quote > div {padding:2px 0}
  #branchCheckout .ute-delivery-quote > div:last-child {border-top:1px solid #d8e4d5;margin-top:8px;padding-top:12px;font-weight:800;font-size:18px;color:#315539}
 </style>
</section>
</body></html>
