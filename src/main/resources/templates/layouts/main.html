<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      lang="vi"
      th:fragment="html(content, scripts)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#535744">
    <meta name="description" content="UTE Tea – Tinh vị trà, chạm vị thanh xuân. Khám phá và đặt món trực tuyến.">
    <link rel="icon" type="image/png" th:href="@{/images/ute-tea-olive-mark.png}">
    <title th:text="${pageTitle != null ? pageTitle + ' | UTE Tea' : 'UTE Tea | Tinh vị trà, chạm vị thanh xuân'}">UTE Tea</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Bootstrap 5 & Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/receipts.css}">
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <link rel="stylesheet" th:href="@{/css/ute-theme.css}">
    <link rel="stylesheet" th:href="@{/css/ute-olive.css}">
</head>
<body>

    <div class="ute-topbar" sec:authorize="!hasAnyRole('ADMIN','CASHIER','KITCHEN','CHEF')">
        <span><i class="bi bi-stars me-1"></i> UTE TEA • TINH VỊ TRÀ, CHẠM VỊ THANH XUÂN</span>
        <span class="ute-topbar-extra"><i class="bi bi-truck me-1"></i> Chọn món dễ dàng <span class="mx-2">•</span> <i class="bi bi-shield-check me-1"></i> Thanh toán minh bạch</span>
    </div>
    <!-- Header / Navbar Fragment -->
    <div th:replace="~{fragments/header :: navbar}"></div>

    <!-- Main Content Body -->
    <main class="flex-grow-1" th:if="${content != null}" th:replace="${content}">
        <p>Nội dung trang</p>
    </main>
    <main class="flex-grow-1" th:if="${content == null}">
        <p>Nội dung trang</p>
    </main>

    <!-- Footer Fragment -->
    <div th:replace="~{fragments/footer :: footer}"></div>

    <!-- Realtime Toast Notifications -->
    <div class="toast-container position-fixed bottom-0 start-50 translate-middle-x p-3" style="z-index: 1090;">
        <div id="liveToast" class="toast align-items-center text-white bg-success border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    <strong class="toast-title d-block mb-1">Thông báo</strong>
                    <span class="toast-message">Hành động thành công</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Modal Khi Phiên Bàn Bị Đóng (TABLE_SESSION_CLOSED) -->
    <div class="modal fade" id="sessionClosedModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-body text-center p-4">
                    <div class="mb-3 text-warning">
                        <i class="bi bi-clock-history fs-1"></i>
                    </div>
                    <h4 class="brand-font mb-2">Phiên bàn đã kết thúc</h4>
                    <p class="text-muted">Thu ngân đã đóng phiên của lượt dùng này. Cảm ơn quý khách đã ghé thăm quán!</p>
                    <a th:href="@{/}" class="btn btn-primary-custom w-100 rounded-pill py-2">
                        <i class="bi bi-house-door me-1"></i> Quay về trang chủ
                    </a>
                </div>
            </div>
        </div>
    </div>

    <link rel="stylesheet" th:href="@{/css/ute-polish.css}">
    <link rel="stylesheet" th:href="@{/css/staff-unified.css}">
    <link rel="stylesheet" th:href="@{/css/ute-layout-final.css}">

    <!-- External Libs: Bootstrap 5, SockJS, StompJS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!-- MilkTea Common Scripts -->
    <script th:src="@{/js/common/api.js}"></script>
    <script th:src="@{/js/common/websocket.js}"></script>

    <div id="receiptShop" hidden th:attr="data-name='UTE Tea',data-address=${settings != null ? settings.address : ''},data-bank=${settings != null ? settings.bankName : ''},data-account=${settings != null ? settings.bankAccountNumber : ''},data-holder=${settings != null ? settings.bankAccountHolder : ''}"></div>
    <script th:src="@{/js/common/receipts.js}"></script>
    <script sec:authorize="hasRole('ADMIN')" th:src="@{/js/admin/notifications.js}"></script>
    <script sec:authorize="hasAnyRole('CASHIER','ADMIN')" th:src="@{/js/common/pending-orders.js}"></script>
    <!-- Page Specific Script Block -->
    <th:block th:if="${scripts != null}" th:replace="${scripts}"></th:block>
</body>
</html>
