spring:
  datasource:
    # Keep demo carts/accounts/orders across IDE restarts.
    # Tests can override this with an isolated in-memory DEMO_DB_URL.
    url: ${DEMO_DB_URL:jdbc:h2:file:./data/ute-tea-demo;DB_CLOSE_ON_EXIT=FALSE;MODE=MSSQLServer}
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false

logging:
  level:
    vn.edu.ute.milktea: INFO
    org.springframework.security: WARN

app:
  # MarketplaceDemoData creates Campus as Shop 1 on the first demo initialization.
  pos:
    shop-id: 1
  admin:
    default-password: Password@123
  jwt:
    secret-base64: dGhpc0lzQVZlcnlTZWN1cmVCYXNlNjRTZWNyZXRLZXlGb3JNaWxrVGVhQXBwMjAyNg==
    ttl-minutes: 120
